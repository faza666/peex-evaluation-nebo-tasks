[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
