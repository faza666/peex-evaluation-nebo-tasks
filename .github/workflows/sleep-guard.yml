name: sleep-guard

# The safety net: every hour, put to sleep any compute that is awake past its sleep-after
# time, or that has run without one for more than 2 hours. Quiet unless it acts.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be done"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # OIDC sign-in to Azure; no stored credentials

concurrency:
  group: nebo-power
  cancel-in-progress: false

jobs:
  guard:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Add the Resource Graph extension
        run: az extension add --name resource-graph --upgrade --only-show-errors
      - name: Guard
        env:
          DRY_RUN: ${{ inputs.dry_run }}  # empty on scheduled runs
        run: |
          if [[ $DRY_RUN == true ]]; then
            scripts/ops/sleep-guard.sh --dry-run
          else
            scripts/ops/sleep-guard.sh
          fi
