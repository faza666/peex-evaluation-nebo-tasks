name: docker-build

# Runs on every pull request and every push to main:
#   lint → unit tests with coverage → SonarQube Cloud quality gate
#   CodeQL (Python and these workflows) and the Trivy gate on the Terraform code, in parallel
#   build the image → Trivy image scan and gate → on main only, push to ACR as v<version> and sha-<7>
# Findings go to the Security tab as SARIF; the summary job links every result in one place.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run; runs on main always finish.
  group: docker-build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: menu

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Ruff lint and format check, on the runtime Python
        env:
          CMD: >-
            pip install -q "$(grep '^ruff==' core/app/requirements-dev.txt)" &&
            ruff check --output-format=github --config core/app/pyproject.toml core &&
            ruff format --check --config core/app/pyproject.toml core
        run: core/scripts/ci/in-runtime-image.sh "$CMD"

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core/app
    outputs:
      tests: ${{ steps.report.outputs.tests }}
      coverage: ${{ steps.report.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests with coverage, on the runtime Python
        env:
          CMD: >-
            pip install -q -r requirements-dev.txt &&
            python -m pytest --cov --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml
        run: ../scripts/ci/in-runtime-image.sh "$CMD"
      - name: Report
        id: report
        if: ${{ !cancelled() }}
        run: python3 ../scripts/ci/test-report.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            core/app/coverage.xml
            core/app/test-results.xml
          if-no-files-found: warn
          retention-days: 14

  sonar:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gate: ${{ steps.result.outputs.gate }}
      seconds: ${{ steps.result.outputs.seconds }}
      url: ${{ steps.result.outputs.url }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # blame data, so SonarQube Cloud can tell new code from old
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test-reports
          path: core/app
      - name: Note a missing token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning title=SonarQube Cloud skipped::SONAR_TOKEN is not available (not set yet, or a fork)."
      - name: Start the clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: SonarQube Cloud scan, waiting for the quality gate
        id: scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304  # v8.4.0
        with:
          projectBaseDir: core/app
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Record the result
        id: result
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          START: ${{ steps.clock.outputs.start }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          key=$(sed -n 's/^sonar.projectKey=//p' core/app/sonar-project.properties)
          if [[ -n $PR_NUMBER ]]; then
            url="https://sonarcloud.io/summary/new_code?id=$key&pullRequest=$PR_NUMBER"
          else
            url="https://sonarcloud.io/summary/new_code?id=$key&branch=$GITHUB_REF_NAME"
          fi
          case $OUTCOME in
            success) gate=passed ;;
            failure) gate=failed ;;
            *) gate=skipped ;;
          esac
          seconds=$(($(date +%s) - START))
          printf 'gate=%s\nseconds=%s\nurl=%s\n' "$gate" "$seconds" "$url" >> "$GITHUB_OUTPUT"
          echo "Quality gate: $gate, in $seconds s. $url"

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload results to the Security tab
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      gate: ${{ steps.scan.outputs.gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-trivy
      - name: Trivy misconfiguration scan of the Terraform code and gate
        id: scan
        env:
          FAIL_ON: ${{ vars.TRIVY_IAC_FAIL_ON || 'HIGH,CRITICAL' }}  # set the variable to "none" to report only
        run: core/scripts/ci/trivy-iac.sh .
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: ${{ !cancelled() && hashFiles('trivy-iac.sarif') != '' }}
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  image:
    needs: [test, sonar]
    # Build and scan whenever the tests pass, even when the quality gate fails; only the push needs the gate.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload results to the Security tab
      id-token: write  # OIDC sign-in to Azure, used only to push from main
    env:
      # Push only from main, and only images whose code passed the quality gate.
      PUBLISH: >-
        ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        && needs.sonar.outputs.gate == 'passed' && vars.AZURE_CLIENT_ID != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      critical: ${{ steps.trivy.outputs.critical }}
      high: ${{ steps.trivy.outputs.high }}
      fixable: ${{ steps.trivy.outputs.fixable }}
      gate: ${{ steps.trivy.outputs.gate }}
      report: ${{ steps.report.outputs.artifact-url }}
      digest: ${{ steps.push.outputs.digest }}
      registry_missing: ${{ steps.push.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the version counts the commits since VERSION changed
          persist-credentials: false
      - name: Version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          version=$(core/scripts/ci/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: v$version"
      - name: Registry name
        id: registry
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          # The name wake-up.sh gives it: acrnebo + the first 6 hex characters of sha256(subscription ID).
          name="acrnebo$(printf '%s' "$SUBSCRIPTION_ID" | sha256sum | cut -c1-6)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "server=$name.azurecr.io" >> "$GITHUB_OUTPUT"
      - name: Build
        id: build
        env:
          VERSION: v${{ steps.version.outputs.version }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          REGISTRY: ${{ steps.registry.outputs.server }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          repo="$REGISTRY/$IMAGE_NAME"
          docker build \
            --build-arg "APP_VERSION=$VERSION" \
            --label "org.opencontainers.image.title=$IMAGE_NAME" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "io.github.faza666.ci.run-url=$RUN_URL" \
            --tag "$repo:$VERSION" \
            --tag "$repo:sha-${REVISION::7}" \
            core/app
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$repo:$VERSION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-trivy
      - name: Date for the Trivy database cache
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: Trivy image scan and gate
        id: trivy
        env:
          FAIL_ON: ${{ vars.TRIVY_FAIL_ON || 'CRITICAL' }}  # set the variable to "none" to report only
          IMAGE: ${{ steps.build.outputs.ref }}
        run: core/scripts/ci/trivy-image.sh "$IMAGE"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: ${{ !cancelled() && hashFiles('trivy-image.sarif') != '' }}
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Upload the Trivy report
        id: report
        if: ${{ !cancelled() && hashFiles('trivy-image.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-image-report
          path: |
            trivy-image.txt
            trivy-image.json
          retention-days: 30
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        if: env.PUBLISH == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        id: push
        if: env.PUBLISH == 'true'
        env:
          ACR_NAME: ${{ steps.registry.outputs.name }}
          REPO: ${{ steps.build.outputs.repo }}
          REF: ${{ steps.build.outputs.ref }}
        run: |
          if ! az acr show --name "$ACR_NAME" --only-show-errors -o none; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::error title=No registry::$ACR_NAME does not exist." \
              "Run the wake-up workflow, which creates it, then re-run this job."
            exit 1
          fi
          az acr login --name "$ACR_NAME"
          docker push --all-tags "$REPO"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REF")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $digest"

  summary:
    needs: [lint, test, sonar, codeql, iac-scan, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: core/scripts/ci
      - name: Run summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: core/scripts/ci/summary.sh >> "$GITHUB_STEP_SUMMARY"
