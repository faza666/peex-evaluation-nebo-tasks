name: wake-up

# Start the current stage's compute and tag it to sleep after N hours.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to wake: all, or a comma-separated list of vm, aks, appgw, aca"
        type: string
        default: all
        required: true
      hours:
        description: "Hours until sleep-guard may put it back to sleep (1-12)"
        type: number
        default: 4
        required: true

permissions:
  contents: read
  id-token: write  # OIDC sign-in to Azure as mi-nebo-ops; no stored credentials

concurrency:
  group: nebo-power
  cancel-in-progress: false

jobs:
  wake-up:
    if: vars.AZURE_CLIENT_ID_OPS != ''  # mi-nebo-ops: start, stop and tag compute in the stage groups
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_OPS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Add the Resource Graph extension
        run: az extension add --name resource-graph --upgrade --only-show-errors
      - name: Wake up
        env:
          TARGETS: ${{ inputs.targets }}
          HOURS: ${{ inputs.hours }}
        run: core/scripts/ops/wake-up.sh --targets "$TARGETS" --hours "$HOURS"
