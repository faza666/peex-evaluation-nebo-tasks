name: sleep

# Stop or deallocate the current stage's compute; state and configuration are kept.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "What to sleep: all, or a comma-separated list of vm, aks, appgw"
        type: string
        default: all
        required: true

permissions:
  contents: read
  id-token: write  # OIDC sign-in to Azure as mi-nebo-ops; no stored credentials

concurrency:
  group: nebo-power
  cancel-in-progress: false

jobs:
  sleep:
    if: vars.AZURE_CLIENT_ID_OPS != ''  # mi-nebo-ops: start, stop and tag compute in the stage groups
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_OPS }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Add the Resource Graph extension
        run: az extension add --name resource-graph --upgrade --only-show-errors
      - name: Sleep
        env:
          TARGETS: ${{ inputs.targets }}
        run: core/scripts/ops/sleep.sh --targets "$TARGETS"
