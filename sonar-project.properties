# SonarQube Cloud (formerly SonarCloud) analysis settings, read by the scan step in docker-build.yml.
# Automatic Analysis is turned off in the project, so this CI analysis can import coverage.
sonar.organization=faza666
sonar.projectKey=faza666_peex-evaluation-nebo-tasks
sonar.projectName=peex-evaluation-nebo-tasks

# Only the application package is analysed. Scripts, migrations and infrastructure code are
# covered by ruff, CodeQL and Trivy instead, so they don't dilute the new-code coverage gate.
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Keep in step with the Dockerfile's base image.
sonar.python.version=3.8
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml
