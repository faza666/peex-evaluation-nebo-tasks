# Every NEBo role assignment. This is the list the subscription owner reviews: rbac.yml shows each change in a
# Teams card and applies it only after the owner approves the run in GitHub. See README.md.
#
# Under each principal (an identity from core/identities/identities.yaml, or `operator` for you) every grant is
#   <built-in role> @ <scope>
# with one of these scopes:
#   rg:<group>          a NEBo resource group: mgmt, core, stage-a, stage-b or stage-c
#   container:<name>    a Terraform state container: tfstate-core, tfstate-stage-a, tfstate-stage-b, tfstate-stage-c
#   mi:<identity>       a managed identity in rg-nebo-mgmt, for Managed Identity Operator
#   <group>/<tag>       the one resource in rg-nebo-<group> that its stack tagged nebo:scope=<tag>, e.g. core/acr
# Never accepted: Owner, User Access Administrator and Role Based Access Control Administrator; any grant on
# mi-nebo-rbac; the identities and rbac state containers; anything outside the NEBo resource groups.
#
# Groups match identities.yaml and live as long as its groups do. Turning a group off removes its grants, which
# the owner approves like any other change; do that before turning the same group off in identities.yaml.
# A grant on a resource is added in the work item that creates the resource, because it must exist first.

groups:
  shared:  # A -> end of C
    active: true
    grants:
      mi-nebo-core:
        - Contributor @ rg:core
        - Storage Blob Data Contributor @ container:tfstate-core
      mi-nebo-ci:
        - AcrPush @ core/acr
      mi-nebo-ops:
        - Reader @ rg:core
      # Reader on every stage group from the start, and kept here rather than in the stage's own group, so you can
      # still check a stage's teardown after its grants are gone. Remove a line once the subscription owner has
      # deleted that group: the assignment goes with it, so nothing is left to approve.
      operator:
        - Reader @ rg:core
        - Reader @ rg:stage-a
        - Reader @ rg:stage-b
        - Reader @ rg:stage-c
        - Key Vault Secrets Officer @ core/kv
        - Log Analytics Reader @ core/law

  stage-a:  # A -> end of B
    active: true
    grants:
      # Added with the stacks that create the resources: mi-nebo-cd-a Container Apps Contributor on the two apps
      # (aca); mi-nebo-config Network Contributor on the VM's NSG (vm).
      mi-nebo-stage-a:
        - Contributor @ rg:stage-a
        - Storage Blob Data Contributor @ container:tfstate-stage-a
        - Reader @ rg:core
        - Log Analytics Contributor @ core/law  # the Container Apps environment sends its logs there
        - Managed Identity Operator @ mi:mi-nebo-menu-aca
        - Managed Identity Operator @ mi:mi-nebo-vm
      mi-nebo-ops:
        - Reader @ rg:stage-a
        - Virtual Machine Contributor @ rg:stage-a
        - Tag Contributor @ rg:stage-a
      mi-nebo-config:
        - Reader @ rg:stage-a
      mi-nebo-menu-aca:
        - AcrPull @ core/acr
        - Key Vault Secrets User @ core/kv
      mi-nebo-vm:
        - AcrPull @ core/acr

  stage-b:  # B -> end of C
    active: false
    grants: {}

  stage-c:  # C only
    active: false
    grants: {}
